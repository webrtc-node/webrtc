name: Prebuild Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild-linux:
    name: Prebuild ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-glibc
            dockerfile: build-containers/Dockerfile.debian
            image: webrtc-node-prebuild-debian
            build_args: --build-arg NODE_VERSION=20 --build-arg DEBIAN_VERSION=bullseye
            libc: glibc

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Build Linux prebuild
        run: |
          docker build --no-cache --pull \
            -f "${{ matrix.dockerfile }}" \
            ${{ matrix.build_args }} \
            -t "${{ matrix.image }}" .
          docker run --rm \
            -v "$PWD:/usr/app" \
            -w /usr/app \
            "${{ matrix.image }}" \
            sh -lc "npm ci --ignore-scripts && npm run build -- --CDWEBRTC_NODE_STATIC_OPENSSL=ON && npm run prebuild:package -- --platform=linux --arch=x64 --libc=${{ matrix.libc }} && node -e \"const { RTCPeerConnection } = require('./'); const pc = new RTCPeerConnection(); pc.close();\""

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuild-artifacts/*

      - name: Verify Debian toolchain and static addon dependencies
        run: |
          docker run --rm -v "$PWD:/usr/app" -w /usr/app webrtc-node-prebuild-debian sh -lc 'set -eu
            cmake --version
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
            dpkg-query -W libc6 cmake libssl-dev
            readelf -h build/Release/webrtc_node.node
            readelf -d build/Release/webrtc_node.node
            readelf --version-info build/Release/webrtc_node.node
            ldd build/Release/webrtc_node.node > /tmp/addon-dependencies
            cat /tmp/addon-dependencies
            ! grep -E "libssl|libcrypto|not found" /tmp/addon-dependencies
            grep -E "OPENSSL_(CRYPTO|SSL)_LIBRARY:FILEPATH=.*\.a$" build/CMakeCache.txt
            npm run native:check
            npm run api:check
            npm run types:check
            npm test
            npm run example:datachannel
          '
