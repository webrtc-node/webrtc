name: Windows ARM64 Dependency Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - shell: pwsh
        run: '"VCPKG_OVERLAY_TRIPLETS=$PWD/diagnostic-triplets" >> $env:GITHUB_ENV'
      - uses: ./.github/actions/setup-native-build
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node examples/datachannel.js
      - run: npm test
      - run: npm run api:check
      - run: npm run types:check
