name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-recovery-v0.2.2
  cancel-in-progress: false

jobs:
  publish:
    name: Recover npm 0.2.2 publication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify immutable release commit and package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 228e0501dbbaf61732cb3991fe5a7a959fd36b10
          test "$(node -p "const p = require('./package.json'); p.name + '@' + p.version")" = '@webrtc-node/webrtc@0.2.2'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = 0.2.2

      - name: Verify and download existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.2.2 --json assets > /tmp/release-assets.json
          gh release download v0.2.2 --dir prebuild-artifacts
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const hashes = {
            'darwin-arm64': 'd0848da98fbbf421e9079e152b2eea6abfa974b57c1b54e1dedd0b317489d119',
            'darwin-x64': 'adf1c445af01c505c7174b1762d47f26e5c7efcb456cceb5e5d76a69955f9210',
            'linux-arm64-glibc': '556655f705a13efc8cb3d33e1d7baadd81bed0d84c4e579a3dbe0c2125930efe',
            'linux-x64-glibc': '7d60c610607c2143d95b7617492ef328ee3608f5f026acb942d7526547f84793',
            'linux-x64-musl': '298fe9d1d91fb2a3f244f42b11f40d795b3cb3b36947dba2396f72501c0b7e53',
            'win32-arm64': '3c51634146a0c7a1bb0d64853886edb5f0f035e7d997f5ba78312109790e2b31',
            'win32-x64': '44c2bccb933fb0ffcb9cb38df730176103d5230ffc092dd7f1823cfc46a5d485',
          };
          const { assets } = JSON.parse(fs.readFileSync('/tmp/release-assets.json', 'utf8'));
          assert.equal(assets.length, 14);
          for (const [target, hash] of Object.entries(hashes)) {
            const name = `webrtc-node-v0.2.2-napi-v8-${target}.tar.gz`;
            assert.equal(assets.find(asset => asset.name === name)?.digest, `sha256:${hash}`);
            assert.ok(assets.find(asset => asset.name === `${name}.sha256`));
            assert.equal(createHash('sha256').update(fs.readFileSync(`prebuild-artifacts/${name}`)).digest('hex'), hash);
          }
          NODE

      - run: npm ci --ignore-scripts
      - run: npm run prebuild:check
      - run: npm run native:check

      - name: Refuse an existing npm version
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://registry.npmjs.org/@webrtc-node%2Fwebrtc/0.2.2');
          if (response.status !== 404) throw new Error(`Expected an unpublished version; registry returned ${response.status}`);
          NODE

      - name: Publish validated package to npm
        run: npm publish --access public --tag latest --provenance

      - name: Verify exact npm version and latest
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://registry.npmjs.org/@webrtc-node%2Fwebrtc');
          if (!response.ok) throw new Error(`Registry returned ${response.status}`);
          const metadata = await response.json();
          if (metadata.versions['0.2.2']?.version !== '0.2.2' || metadata['dist-tags'].latest !== '0.2.2') {
            throw new Error('Published version or latest does not match 0.2.2');
          }
          NODE
