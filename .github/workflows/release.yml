name: Prebuild Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild-linux:
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-glibc
            os: ubuntu-latest
            arch: x64
            dockerfile: build-containers/Dockerfile.debian
            image: webrtc-node-prebuild-debian
            build_args: --build-arg NODE_VERSION=20 --build-arg DEBIAN_VERSION=bullseye
            libc: glibc
          - target: linux-x64-musl
            os: ubuntu-latest
            arch: x64
            dockerfile: build-containers/Dockerfile.alpine
            image: webrtc-node-prebuild-alpine
            build_args: --build-arg NODE_VERSION=20 --build-arg ALPINE_VERSION=3.20
            libc: musl
          - target: linux-arm64-glibc
            os: ubuntu-24.04-arm
            arch: arm64
            dockerfile: build-containers/Dockerfile.debian
            image: webrtc-node-prebuild-debian-arm64
            build_args: --build-arg NODE_VERSION=20 --build-arg DEBIAN_VERSION=bullseye
            libc: glibc

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Build Linux prebuild
        run: |
          docker build --no-cache --pull \
            -f "${{ matrix.dockerfile }}" \
            ${{ matrix.build_args }} \
            -t "${{ matrix.image }}" .
          docker run --rm \
            -v "$PWD:/usr/app" \
            -w /usr/app \
            "${{ matrix.image }}" \
            sh -lc "npm ci --ignore-scripts && npm run build -- --CDWEBRTC_NODE_STATIC_OPENSSL=ON && npm run prebuild:package -- --platform=linux --arch=${{ matrix.arch }} --libc=${{ matrix.libc }} && node -e \"const { RTCPeerConnection } = require('./'); const pc = new RTCPeerConnection(); pc.close();\""

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuild-artifacts/*

      - name: Inspect Linux release addon and exchange a data-channel message
        run: |
          docker run --rm -v "$PWD:/usr/app" -w /usr/app "${{ matrix.image }}" sh -lc 'set -eu
            cmake --version
            getconf GNU_LIBC_VERSION || true
            readelf -h build/Release/webrtc_node.node
            readelf -d build/Release/webrtc_node.node > /tmp/addon-dependencies
            cat /tmp/addon-dependencies
            readelf --version-info build/Release/webrtc_node.node
            ! grep -E "Shared library:.*(libssl|libcrypto)" /tmp/addon-dependencies
            grep -E "OPENSSL_(CRYPTO|SSL)_LIBRARY:FILEPATH=.*\.a$" build/CMakeCache.txt
            npm run native:check
            npm run api:check
            npm run types:check
            npm test
            npm run example:datachannel
            npm exec -c "node scripts/validate-prebuild-install.js"
          '

  prebuild-macos:
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: darwin-x64
            arch: x64
          - os: macos-15
            target: darwin-arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: ./.github/actions/setup-native-build

      - run: npm ci --ignore-scripts

      - run: npm run build -- --arch=${{ matrix.arch }} --CDWEBRTC_NODE_STATIC_OPENSSL=ON

      - run: npm run prebuild:package -- --platform=darwin --arch=${{ matrix.arch }}

      - run: node -e "const { RTCPeerConnection } = require('./'); const pc = new RTCPeerConnection(); pc.close();"

      - run: npm exec -c "node scripts/validate-prebuild-install.js"

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuild-artifacts/*

  prebuild-windows:
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            arch: x64
          - os: windows-11-arm
            target: win32-arm64
            arch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: ./.github/actions/setup-native-build

      - run: npm ci --ignore-scripts

      - run: npm run build -- --arch=${{ matrix.arch }} --CDWEBRTC_NODE_STATIC_OPENSSL=ON

      - run: npm run prebuild:package -- --platform=win32 --arch=${{ matrix.arch }}

      - run: node -e "const { RTCPeerConnection } = require('./'); const pc = new RTCPeerConnection(); pc.close();"

      - run: npm exec -c "node scripts/validate-prebuild-install.js"

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.target }}
          path: prebuild-artifacts/*

  validate:
    name: Validate aggregated prebuilds
    runs-on: ubuntu-latest
    needs: [prebuild-linux, prebuild-macos, prebuild-windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: prebuild-artifacts
          merge-multiple: true
      - run: npm ci --ignore-scripts
      - run: npm run prebuild:check
      - run: npm run native:check

  arm64-musl-fallback:
    name: ARM64 musl source fallback
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Exercise unsupported prebuild target source fallback
        run: |
          docker build --no-cache --pull -f build-containers/Dockerfile.alpine --build-arg NODE_VERSION=20 --build-arg ALPINE_VERSION=3.20 -t webrtc-node-arm64-musl .
          docker run --rm -v "$PWD:/usr/app" -w /usr/app webrtc-node-arm64-musl sh -lc 'npm ci --ignore-scripts && npm exec -c "node scripts/validate-prebuild-install.js --source-fallback"'
