name: Windows ARM64 Dependency Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@v5
        id: diagnostic-cache
        with:
          path: vcpkg_installed
          key: diagnostic-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('vcpkg.json') }}
      - uses: ./.github/actions/setup-native-build
      - uses: actions/cache/save@v5
        if: steps.diagnostic-cache.outputs.cache-hit != 'true'
        with:
          path: vcpkg_installed
          key: ${{ steps.diagnostic-cache.outputs.cache-primary-key }}
      - run: npm ci --ignore-scripts
      - run: npm run build -- --CDLIBDATACHANNEL_PINNED_COMMIT=502ae351495792192ef21788e093b48e34ab393e
      - run: node examples/datachannel.js
      - run: npm test
      - run: npm run api:check
      - run: npm run types:check
