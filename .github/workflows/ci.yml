name: Windows ARM64 Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@v5
        id: diagnostic-cache
        with:
          path: vcpkg_installed
          key: diagnostic-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('vcpkg.json') }}
      - uses: ./.github/actions/setup-native-build
      - uses: actions/cache/save@v5
        if: steps.diagnostic-cache.outputs.cache-hit != 'true'
        with:
          path: vcpkg_installed
          key: ${{ steps.diagnostic-cache.outputs.cache-primary-key }}
      - run: npm ci --ignore-scripts
      - run: npm run build -- --CDCMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Zi" --CDCMAKE_C_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Zi" --CDCMAKE_SHARED_LINKER_FLAGS_RELEASE="/DEBUG /OPT:REF /OPT:ICF"
      - name: Capture TAP test diagnostics
        continue-on-error: true
        env:
          WEBRTC_NODE_LIBDATACHANNEL_LOG: debug
        run: node --test --test-reporter=tap --test-force-exit --test-timeout=30000 test/basic.test.js test/nonstandard.test.js
      - name: Capture a direct data-channel crash dump
        continue-on-error: true
        env:
          WEBRTC_NODE_LIBDATACHANNEL_LOG: debug
        run: |
          New-Item -ItemType Directory -Path ci-artifacts/dumps -Force | Out-Null
          Invoke-WebRequest https://live.sysinternals.com/arm64/procdump64a.exe -OutFile "$env:RUNNER_TEMP/procdump64a.exe"
          & "$env:RUNNER_TEMP/procdump64a.exe" -accepteula -ma -e -x "$PWD/ci-artifacts/dumps" (Get-Command node).Source examples/datachannel.js
          Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object FullName
      - name: Compare without OpenSSL ARM CPU acceleration
        continue-on-error: true
        env:
          OPENSSL_armcap: '0'
          WEBRTC_NODE_LIBDATACHANNEL_LOG: debug
        run: node examples/datachannel.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-arm64-diagnostics
          path: |
            ci-artifacts/dumps/*
            build/Release/*.node
            build/Release/*.pdb
