name: Windows ARM64 Release Build Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache/restore@v5
        id: diagnostic-cache
        with:
          path: vcpkg_installed
          key: diagnostic-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('vcpkg.json') }}
      - uses: ./.github/actions/setup-native-build
      - uses: actions/cache/save@v5
        if: steps.diagnostic-cache.outputs.cache-hit != 'true'
        with:
          path: vcpkg_installed
          key: ${{ steps.diagnostic-cache.outputs.cache-primary-key }}
      - run: npm ci --ignore-scripts
      - run: npm run build -- --CDWEBRTC_NODE_STATIC_OPENSSL=ON --CDLIBDATACHANNEL_PINNED_COMMIT=6b1e2e620f1e37f0eafeee702eaea0043cb305fd
      - run: node examples/datachannel.js
      - run: npm test
      - run: npm run api:check
      - run: npm run types:check
