name: Windows ARM64 Published Binary Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-native:
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    env:
      WEBRTC_NODE_PREBUILD_ONLY: '1'
      WEBRTC_NODE_LIBDATACHANNEL_LOG: debug
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Exercise the existing stable Windows ARM64 binary
        run: |
          $taskInstallPath = Join-Path $env:RUNNER_TEMP 'webrtc-published-smoke'
          New-Item -ItemType Directory -Path $taskInstallPath -Force | Out-Null
          $taskSmoke = (Get-Content examples/datachannel.js -Raw).Replace('require("..")', 'require("@webrtc-node/webrtc")')
          Set-Content -LiteralPath (Join-Path $taskInstallPath 'smoke.cjs') -Value $taskSmoke
          Push-Location $taskInstallPath
          npm init -y
          npm install '@webrtc-node/webrtc@0.2.1'
          if ($LASTEXITCODE -ne 0) { throw 'Published package installation failed' }
          node smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Published ARM64 data-channel smoke failed' }
          Pop-Location
