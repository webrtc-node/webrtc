name: Published Install

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: npm package spec to install (tag or exact version)
        required: true
        default: "@webrtc-node/webrtc@latest"
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  package:
    name: Resolve package
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      spec: ${{ steps.resolve.outputs.spec }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - id: resolve
        name: Resolve npm package spec
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE_SPEC: ${{ inputs.package_spec }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            spec="$INPUT_PACKAGE_SPEC"
          else
            spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          fi

          # A new version can take several minutes to appear on the registry,
          # and npm silently skips an optional dependency it cannot see yet, so
          # wait for the main package and every platform package it names.
          deadline=$((SECONDS + 900))
          until version="$(npm view "$spec" version 2>/dev/null)" && [ -n "$version" ] &&
            node -e '
              const { execFileSync } = require("node:child_process");
              const deps = JSON.parse(execFileSync("npm", ["view", process.argv[1], "optionalDependencies", "--json"], { encoding: "utf8" }) || "{}");
              const missing = Object.entries(deps).filter(([name, range]) => {
                try {
                  return !execFileSync("npm", ["view", `${name}@${range}`, "version"], { encoding: "utf8" }).trim();
                } catch {
                  return true;
                }
              });
              if (missing.length) {
                console.log(`Waiting for ${missing.map(([name]) => name).join(", ")}`);
                process.exit(1);
              }
            ' "@webrtc-node/webrtc@$version"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "The packages did not appear on the registry within 15 minutes."
              exit 1
            fi
            sleep 30
          done

          spec="@webrtc-node/webrtc@$version"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "Testing $spec" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-glibc
            os: ubuntu-latest
            image: node:24-bookworm
          - target: linux-x64-musl
            os: ubuntu-latest
            image: node:24-alpine
          - target: linux-arm64-glibc
            os: ubuntu-24.04-arm
            image: node:24-bookworm
          - target: linux-arm64-musl
            os: ubuntu-24.04-arm
            image: node:24-alpine

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Install published package
        env:
          PACKAGE_SPEC: ${{ needs.package.outputs.spec }}
        run: |
          docker run --rm \
            -v "$PWD/examples/datachannel.js:/smoke-source.js:ro" \
            -e PACKAGE_SPEC \
            "${{ matrix.image }}" \
            sh -lc 'set -eu
              workdir="$(mktemp -d)"
              cd "$workdir"
              npm init -y >/dev/null
              # Lifecycle scripts stay disabled, as in package managers that block them.
              for attempt in 1 2 3; do
                if npm install "$PACKAGE_SPEC" --ignore-scripts; then
                  break
                fi
                if [ "$attempt" = "3" ]; then
                  exit 1
                fi
                sleep $((attempt * 10))
              done
              test ! -e node_modules/@webrtc-node/webrtc/build
              node -e "const { RTCPeerConnection } = require(\"@webrtc-node/webrtc\"); const pc = new RTCPeerConnection(); pc.close(); console.log(\"cjs ok\");"
              node --input-type=module -e "import { RTCPeerConnection } from \"@webrtc-node/webrtc\"; const pc = new RTCPeerConnection(); pc.close(); console.log(\"esm ok\");"
              sed "s|require(\"..\")|require(\"@webrtc-node/webrtc\")|" /smoke-source.js > smoke.cjs
              node smoke.cjs
            '

  hosted:
    name: ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-15
          - target: win32-x64
            os: windows-latest
          - target: win32-arm64
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install published package
        shell: bash
        env:
          PACKAGE_SPEC: ${{ needs.package.outputs.spec }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"
          npm init -y >/dev/null
          # Lifecycle scripts stay disabled, as in package managers that block them.
          for attempt in 1 2 3; do
            if npm install "$PACKAGE_SPEC" --ignore-scripts; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          test ! -e node_modules/@webrtc-node/webrtc/build
          node -e "const { RTCPeerConnection } = require('@webrtc-node/webrtc'); const pc = new RTCPeerConnection(); pc.close(); console.log('cjs ok');"
          node --input-type=module -e "import { RTCPeerConnection } from '@webrtc-node/webrtc'; const pc = new RTCPeerConnection(); pc.close(); console.log('esm ok');"
          sed 's|require("..")|require("@webrtc-node/webrtc")|' "$GITHUB_WORKSPACE/examples/datachannel.js" > smoke.cjs
          node smoke.cjs
